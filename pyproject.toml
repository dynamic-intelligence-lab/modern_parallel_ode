[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parode"
version = "0.1.0"
description = "Parallel-in-time Newton solvers for nonlinear ODEs (DEER and its stabilized variants LASER, ELK and scale-ELK)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Zhouyang Lu"}, {name = "Arvind R. Venkatakrishnan"}, {name = "Emmie Fitz-Gibbon"},
    {name = "Xavier Gonzalez"}, {name = "Yu Kawano"}, {name = "Ian R. Manchester"}, {name = "Eduardo D. Sontag"},
    {name = "Jean-Jacques Slotine"}, {name = "Francesco Bullo"}, {name = "Leo Kozachkov"},
]
# The versions the paper's experiments ran with. On a GPU machine install the matching CUDA build of JAX
# afterwards: pip install "jax[cuda12]==0.6.2".
dependencies = [
    "jax==0.6.2",
    "jaxlib==0.6.2",
    "numpy==2.2.6",
]

[project.optional-dependencies]
experiments = [
    "scipy==1.15.3",
    "equinox==0.13.2",
    "optax==0.2.7",
    "matplotlib==3.10.7",
    "pandas==2.3.3",
    "pillow==11.3.0",
    "nbformat==5.10.4",
    "nbconvert==7.16.6",
    "ipykernel==7.1.0",
]
test = ["pytest==9.0.2"]
# Reads the EigenWorms data of experiments/appendix/contracting_ssm. The CPU build is enough:
# pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
eigenworms = ["torch==2.8.0"]

[tool.setuptools]
packages = ["parode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
